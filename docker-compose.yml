services:
  lavalink:
    image: fredboat/lavalink:4.0.8
    environment:
      - _JAVA_OPTIONS=-Xmx1600M
    deploy:
      resources:
        limits:
          memory: 2048M
    ports:
      - "8080:8080"
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml

  static-site:
    image: nginx:alpine
    volumes:
      - ./web:/usr/share/nginx/html
